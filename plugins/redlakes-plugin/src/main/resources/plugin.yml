name: RedLakesPlugin
main: fr.redlakes.mc.RedLakesPlugin
version: '${version}'
api-version: '1.12'
author: REDLAKES
description: Couche d'exécution Minecraft du REDLAKES CORE — CORE décide, Minecraft applique.
softdepend: [ProtocolLib]

commands:
  rl:
    description: Commandes REDLAKES
    usage: /rl <profil|missions|operation|sync|staff status|staff sync>
  local:
    description: Chat local (§18) — visible dans un rayon de 30 blocs
    usage: /local <message>
    aliases: [l]
  faction:
    description: Chat de faction (§18)
    usage: /faction <message>
    aliases: [f]
  department:
    description: Chat de département (§18)
    usage: /department <message>
    aliases: [dept, d]
  team:
    description: Chat d'équipe (§18)
    usage: /team <message>
    aliases: [t]
  ooc:
    description: Chat hors-RP (§18)
    usage: /ooc <message>
  staffchat:
    description: Chat staff (§18)
    usage: /staffchat <message>
    aliases: [sc]
    permission: redlakes.staff
  # Jamais "op" : entrerait en conflit avec la commande vanilla /op (droits opérateur).
  operation:
    description: Canal d'opération — participants de la même opération active (§33-34)
    usage: /operation <message>
    aliases: [ops]
  whisper:
    description: Message privé à un joueur (§18)
    usage: /whisper <joueur> <message>
    aliases: [w, msg]

permissions:
  redlakes.staff:
    description: Accès aux sous-commandes staff (/rl staff ...)
    default: op
