# PostgreSQL n'est plus ici — Docker Desktop cassait de facon persistante sur
# la machine de dev (socket AF_UNIX bloque, irreparable), la base a migre vers
# Neon (cloud) le 2026-09-09. Voir DATABASE_URL dans apps/api/.env.
# Elasticsearch reste optionnel : l'API bascule sur une recherche SQL si absent.
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: redlakes-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data

volumes:
  elasticsearch_data:
