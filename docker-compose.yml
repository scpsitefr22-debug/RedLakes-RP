services:
  postgres:
    image: postgres:16-alpine
    container_name: redlakes-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: redlakes_user
      POSTGRES_PASSWORD: redlakes_password
      POSTGRES_DB: redlakes_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: redlakes-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data

volumes:
  postgres_data:
  elasticsearch_data:
